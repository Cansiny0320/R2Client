name: Verify and package
on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    name: Renderer, S3 and share service
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:renderer
  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-2025, arch: x64 }
          - { name: linux-x64, os: ubuntu-24.04, arch: x64 }
          - { name: macos-arm64, os: macos-15, arch: arm64 }
          - { name: macos-x64, os: macos-15-intel, arch: x64 }
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Package macOS release with the persistent identity
        if: runner.os == 'macOS' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          R2CLIENT_MAC_CERTIFICATE_P12: ${{ secrets.R2CLIENT_MAC_CERTIFICATE_P12 }}
          R2CLIENT_MAC_CERTIFICATE_PASSWORD: ${{ secrets.R2CLIENT_MAC_CERTIFICATE_PASSWORD }}
        run: pnpm --filter @r2client/desktop exec node scripts/package-mac-ci.mjs --arch ${{ matrix.arch }}
      - name: Package other targets and previews
        if: runner.os != 'macOS' || github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v')
        run: pnpm --filter @r2client/desktop package --${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: r2client-${{ matrix.name }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
          if-no-files-found: error
  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [checks, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: r2client-*
          path: release-assets
          merge-multiple: true
      - name: Verify and publish installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -er '.version' apps/desktop/package.json)
          if [[ "$GITHUB_REF_NAME" != "v$version" || "$(jq -er '.version' package.json)" != "$version" ]]; then
            echo "Release tag and package versions must match" >&2
            exit 1
          fi

          prefix="release-assets/R2Client-$version"
          assets=(
            "$prefix-mac-arm64.dmg"
            "$prefix-mac-arm64.zip"
            "$prefix-mac-x64.dmg"
            "$prefix-mac-x64.zip"
            "$prefix-win-x64.exe"
            "$prefix-linux-x86_64.AppImage"
            "$prefix-linux-amd64.deb"
          )
          for asset in "${assets[@]}"; do
            if [[ ! -s "$asset" ]]; then
              echo "Missing release asset: $asset" >&2
              exit 1
            fi
          done

          gh release create "$GITHUB_REF_NAME" --verify-tag --title "R2Client $GITHUB_REF_NAME" \
            --notes-from-tag "${assets[@]}"
